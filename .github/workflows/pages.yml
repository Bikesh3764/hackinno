# Publishes odyssey/frontend to GitHub Pages. The page calls the Render backend for all computation.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["odyssey/frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  API_BASE: https://hackinno-4vza.onrender.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site/static
          cp -r odyssey/frontend/. _site/static/
          mv _site/static/index.html _site/index.html
          echo "window.ODYSSEY_API = \"${API_BASE}\";" > _site/static/config.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
